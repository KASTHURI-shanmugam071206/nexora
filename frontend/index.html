<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAPPY — Bus Login & Route Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
    :root {
      --bg: #0f1720;
      --panel: #16232c;
      --panel-2: #1b2d3a;
      --line: #2a3d4d;
      --text: #edf6ff;
      --muted: #a7b7c4;
      --green: #38c793;
      --accent: #8ad3ff;
      --warning: #f9c74f;
      --danger: #ff6b6b;
       }
    * { box-sizing: border-box; }
      body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #0d1720 0%, #101d26 100%);
      color: var(--text);
    }
    button, input, select {
      font: inherit;
    }
    .hidden { display: none !important; }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(56, 199, 147, 0.15), transparent 30%), #0e1720;
    }
    .login-card {
      width: min(440px, 100%);
      background: rgba(17, 30, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
       padding: 28px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
    }
  </head>
   .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
