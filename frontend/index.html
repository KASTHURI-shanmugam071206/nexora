<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAPPY — Bus Login & Route Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
    :root {
      --bg: #0f1720;
      --panel: #16232c;
      --panel-2: #1b2d3a;
      --line: #2a3d4d;
      --text: #edf6ff;
      --muted: #a7b7c4;
      --green: #38c793;
      --accent: #8ad3ff;
      --warning: #f9c74f;
      --danger: #ff6b6b;
       }
    * { box-sizing: border-box; }
      body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #0d1720 0%, #101d26 100%);
      color: var(--text);
    }
    button, input, select {
      font: inherit;
    }
    .hidden { display: none !important; }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(56, 199, 147, 0.15), transparent 30%), #0e1720;
    }
    .login-card {
      width: min(440px, 100%);
      background: rgba(17, 30, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
       padding: 28px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
    }
   .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
   .field label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .field input {
      padding: 12px 14px;
      background: #101d28;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      outline: none;
    } 
    .field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(56, 199, 147, 0.2);
    }
    .login-btn, .search-btn, .location-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      background: linear-gradient(135deg, var(--green), #1bbf9b);
      color: #062d22;
      font-weight: 700;
      cursor: pointer;
    }
    .location-btn {
      width: auto;
      padding: 8px 12px;
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .login-btn:hover, .search-btn:hover, .location-btn:hover {
      filter: brightness(1.04);
    }
    .message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--warning);
      font-size: 0.9rem;
    }
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(11, 22, 28, 0.94);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand span { color: var(--green); }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .nav-btn.active {
      background: var(--green);
      color: #062d22;
      border-color: var(--green);
      font-weight: 600;
    }
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 199, 147, 0.12);
      border: 1px solid rgba(56, 199, 147, 0.3);
      color: var(--green);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.84rem;
    }
    .logout-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 18px 20px 0;
    }
    .toolbar-card, .route-card, .bus-card {
      background: rgba(22, 35, 44, 0.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
     .toolbar-card label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 8px;
    }
    .toolbar-card select, .toolbar-card input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0d1a22;
      color: var(--text);
    }
    .main-grid {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 18px;
      padding: 18px 20px 20px;
    }
    .route-list {
      display: grid;
      gap: 12px;
    }
    .route-card {
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .route-card.active {
      border-color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(56, 199, 147, 0.3);
    }
    .route-card:hover { transform: translateY(-1px); }
    .route-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .route-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .route-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }
    .route-card p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #map {
      height: 520px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .route-details {
      display: grid;
      gap: 16px;
    }
    .route-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    .route-header h2 {
      margin: 0;
      font-size: 1.35rem;
    }
    .stop-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .stop-tag {
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(138, 211, 255, 0.08);
      border: 1px solid rgba(138, 211, 255, 0.25);
      color: var(--text);
      font-size: 0.8rem;
    }
    .bus-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .bus-card h4 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .bus-card p {
      margin: 6px 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .time-strong {
      color: var(--green);
      font-weight: 700;
      font-size: 1.2rem;
    }
    footer {
      display: flex;
      justify-content: center;
      padding: 0 20px 20px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      #map { height: 400px; }
    }
  </style>
</head>
<body>
  <div class="login-shell" id="loginScreen">
    <div class="login-card">
      <h1>MAPPY</h1>
      <p>Sign in to view bus routes, timings, and live map details.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" value="demo" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" value="pass123" autocomplete="current-password" />
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="message" id="loginMessage"></div>
      </form>
    </div>
  </div>

  <div class="app-shell hidden" id="appScreen">
    <header>
      <div class="brand">MAPPY <span>Transit</span></div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="nav-tabs">
          <button class="nav-btn active" id="navHome" data-page="home">Trip Search</button>
          <button class="nav-btn" id="navRoutes" data-page="routes">Bus Routes</button>
        </div>
        <div class="user-badge" id="userBadge">Guest</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-card">
        <label for="fromStopSelect">Current location</label>
        <select id="fromStopSelect"></select>
        <button type="button" class="location-btn" id="useLocationBtn">Use my location</button>
      </div>
      <div class="toolbar-card">
        <label for="toStopSelect">Destination</label>
        <select id="toStopSelect"></select>
      </div>
      <div class="toolbar-card">
        <label for="timeInput">Search buses around time</label>
        <input id="timeInput" type="time" value="09:30" />
      </div>
      <div class="toolbar-card" style="display:flex;align-items:flex-end;">
        <button class="search-btn" id="searchBtn">Find buses</button>
      </div>
    </div>

    <div class="main-grid">
      <div class="route-list" id="routeList"></div>
      <div class="route-details">
        <div class="toolbar-card" id="routeSummary"></div>
        <div id="map"></div>
        <div class="toolbar-card">
          <div class="route-header">
            <h2>Buses in time window</h2>
            <span style="color: var(--muted); font-size: 0.85rem;">± 15 minutes</span>
          </div>
          <div class="bus-list" id="busList"></div>
        </div>
      </div>
    </div>
    <div class="main-grid hidden" id="routesPage">
      <div style="grid-column: 1 / -1; display: grid; gap: 16px;">
        <div class="toolbar-card">
          <h2 style="margin: 0 0 16px;">All Available Bus Routes</h2>
          <div class="route-list" id="allRoutesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;"></div>
        </div>
        <div class="toolbar-card">
          <h3 style="margin-top: 0;">Route Details</h3>
          <div id="routeDetailsPanel"></div>
        </div>
      </div>
    </div>
    <footer>MAPPY demo route planner — unique color-coded routes and time-window bus details.</footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const API_BASE = 'http://localhost:5000';
    const USER_KEY = 'mappy_logged_user';
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const userBadge = document.getElementById('userBadge');
    const routeList = document.getElementById('routeList');
    const routeSelect = document.getElementById('routeSelect');
    const fromStopSelect = document.getElementById('fromStopSelect');
    const toStopSelect = document.getElementById('toStopSelect');
    const timeInput = document.getElementById('timeInput');
    const busList = document.getElementById('busList');
    const routeSummary = document.getElementById('routeSummary');
    const logoutBtn = document.getElementById('logoutBtn');
    const searchBtn = document.getElementById('searchBtn');
    const useLocationBtn = document.getElementById('useLocationBtn');

    function safeSetRouteSelect(value) {
      if (routeSelect) {
        routeSelect.value = value;
      }
    }

    let routes = [];
    let selectedRouteId = '';
    let map = null;

    function showLogin() {
      loginScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
    }
    function showApp() {
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
    }
    function getSavedUser() {
      return localStorage.getItem(USER_KEY) || '';
    }
    function saveUser(username) {
      localStorage.setItem(USER_KEY, username);
    }
    function clearUser() {
      localStorage.removeItem(USER_KEY);
    }
    function setUserBadge(name) {
      userBadge.textContent = name || 'Guest';
    }
    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || 'Request failed');
      }
      return response.json();
    }
    
    function buildMap() {
      if (map) return map;
      map = L.map('map').setView([11.017, 76.958], 13.5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(map);
      return map;
    }

    function mapStopIcon(color) {
      return L.divIcon({
        html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px rgba(0,0,0,0.4);"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
    }

    function busIcon(color) {
      return L.divIcon({
        html: `
          <div style="background:${color};width:22px;height:22px;border-radius:8px;border:2px solid white;box-shadow:0 0 10px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;">
            <div style="width:8px;height:8px;border-radius:50%;background:white;"></div>
          </div>
        `,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
    }

    function populateStopSelectors() {
      const stopNames = [...new Set(routes.flatMap((route) => route.stops.map((stop) => stop.name)))];
      fromStopSelect.innerHTML = stopNames.map((stopName) => `<option value="${stopName}">${stopName}</option>`).join('');
      toStopSelect.innerHTML = stopNames.map((stopName) => `<option value="${stopName}">${stopName}</option>`).join('');
      if (stopNames.length) {
        fromStopSelect.value = stopNames[0];
        toStopSelect.value = stopNames[Math.min(stopNames.length - 1, 1)];
      }
    }

    function getNearestStopName(latitude, longitude) {
      const allStops = routes.flatMap((route) => route.stops.map((stop) => ({ ...stop, routeId: route.route_id })));
      if (!allStops.length) return '';

      let nearestStop = allStops[0];
      let nearestDistance = Number.POSITIVE_INFINITY;

      allStops.forEach((stop) => {
        const distance = Math.hypot(stop.lat - latitude, stop.lng - longitude);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestStop = stop;
        }
      });

      return nearestStop.name;
    }

    function renderRouteList() {
      routeList.innerHTML = routes.map((route) => `
        <div class="route-card ${route.route_id === selectedRouteId ? 'active' : ''}" data-route-id="${route.route_id}">
          <div class="route-top">
            <div class="route-pill"><span class="dot" style="background:${route.color};"></span> ${route.route_id}</div>
            <span style="color:${route.color};font-weight:700;">${route.schedule[0]}</span>
          </div>
          <h3>${route.from}</h3>
          <p>to ${route.to}</p>
          <p>${route.schedule.slice(0, 3).join(' • ')}</p>
        </div>
      `).join('');
    routeList.querySelectorAll('.route-card').forEach((card) => {
        card.addEventListener('click', () => {
          selectedRouteId = card.dataset.routeId;
          safeSetRouteSelect(selectedRouteId);
          renderRouteList();
          renderRouteSummary();
          loadBuses();
        });
      });
    }

    function renderRouteSummary() {
      const route = routes.find((item) => item.route_id === selectedRouteId) || routes[0];
      if (!route) return;
      const stops = route.stops.map((stop) => `<span class="stop-tag">${stop.name}</span>`).join('');
      routeSummary.innerHTML = `
        <div class="route-header">
          <h2>${route.from} → ${route.to}</h2>
          <span class="route-pill"><span class="dot" style="background:${route.color};"></span> ${route.route_id}</span>
        </div>
        <p style="margin:0;color:var(--muted);">Timing window: ${route.schedule.join(' • ')}</p>
        <div class="stop-list">${stops}</div>
      `;
    }

    function drawMap(route, buses = []) {
      const mapInstance = buildMap();
      mapInstance.eachLayer((layer) => {
        if (layer instanceof L.Polyline || layer instanceof L.Marker) {
          mapInstance.removeLayer(layer);
        }
      });

      const routeCoords = route.stops.map((stop) => [stop.lat, stop.lng]);
      L.polyline(routeCoords, {
        color: route.color,
        weight: 6,
        opacity: 0.9,
      }).addTo(mapInstance);

      const startStop = route.stops[0];
      const endStop = route.stops[route.stops.length - 1];
      L.marker([startStop.lat, startStop.lng], { icon: mapStopIcon('#3bd98b') }).addTo(mapInstance).bindPopup(`<strong>Start:</strong> ${startStop.name}`);
      L.marker([endStop.lat, endStop.lng], { icon: mapStopIcon('#ff6b6b') }).addTo(mapInstance).bindPopup(`<strong>End:</strong> ${endStop.name}`);

      buses.forEach((bus, index) => {
        const stopIndex = Math.min(route.stops.length - 1, Math.max(0, index % route.stops.length));
        const stop = route.stops[stopIndex];
        const busLat = Number(bus.lat) || stop.lat;
        const busLng = Number(bus.lng) || stop.lng;
        L.marker([busLat, busLng], { icon: busIcon(bus.color || route.color) })
          .addTo(mapInstance)
          .bindPopup(`<strong>${bus.bus_id}</strong><br>${route.from} → ${route.to}<br>Time: ${bus.time}`);
      });

      mapInstance.fitBounds(routeCoords, { padding: [30, 30] });
    }

    function renderBusCards(buses) {
      if (!buses.length) {
        busList.innerHTML = '<p style="color:var(--muted);">No buses found in this time window.</p>';
        return;
      }

      busList.innerHTML = buses.map((bus) => `
        <div class="bus-card">
          <h4>${bus.bus_id}</h4>
          <p><strong style="color:${bus.color};">${bus.route_id}</strong> · ${bus.from} → ${bus.to}</p>
          <p class="time-strong">${bus.time}</p>
          <p>Search time: ${bus.selected_time} · window ± 15 mins</p>
        </div>
      `).join('');
    }

    async function loadBuses() {
      if (!selectedRouteId) return;
      const timeValue = timeInput.value || '09:30';
      try {
        const buses = await fetchJson(`${API_BASE}/api/buses?route_id=${selectedRouteId}&time=${timeValue}`);
        renderBusCards(buses);
        const route = routes.find((item) => item.route_id === selectedRouteId);
        if (route) drawMap(route, buses);
      } catch (error) {
        busList.innerHTML = `<p style="color: var(--warning);">${error.message}</p>`;
      }
    }

    async function loadRoutes() {
      try {
        routes = await fetchJson(`${API_BASE}/api/routes`);
        const ROUTE_COLORS = ['#e6194B', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45'];
        routes.forEach((route, i) => { route.color = ROUTE_COLORS[i % ROUTE_COLORS.length]; });
        if (!routes.length) return;
        selectedRouteId = routes[0].route_id;
        if (routeSelect) {
          routeSelect.innerHTML = routes.map((route) => `<option value="${route.route_id}">${route.route_id} · ${route.from} → ${route.to}</option>`).join('');
          routeSelect.value = selectedRouteId;
        }
        populateStopSelectors();
        renderRouteList();
        renderRouteSummary();
        loadBuses();
      } catch (error) {
        routeList.innerHTML = `<p style="color: var(--warning);">${error.message}</p>`;
      }
    }
