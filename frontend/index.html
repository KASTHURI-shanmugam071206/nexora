<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAPPY — Bus Login & Route Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
    :root {
      --bg: #0f1720;
      --panel: #16232c;
      --panel-2: #1b2d3a;
      --line: #2a3d4d;
      --text: #edf6ff;
      --muted: #a7b7c4;
      --green: #38c793;
      --accent: #8ad3ff;
      --warning: #f9c74f;
      --danger: #ff6b6b;
       }
    * { box-sizing: border-box; }
      body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #0d1720 0%, #101d26 100%);
      color: var(--text);
    }
    button, input, select {
      font: inherit;
    }
  </head>
