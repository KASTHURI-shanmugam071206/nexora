<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAPPY — Bus Login & Route Finder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
    :root {
      --bg: #0f1720;
      --panel: #16232c;
      --panel-2: #1b2d3a;
      --line: #2a3d4d;
      --text: #edf6ff;
      --muted: #a7b7c4;
      --green: #38c793;
      --accent: #8ad3ff;
      --warning: #f9c74f;
      --danger: #ff6b6b;
       }
    * { box-sizing: border-box; }
      body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(180deg, #0d1720 0%, #101d26 100%);
      color: var(--text);
    }
    button, input, select {
      font: inherit;
    }
    .hidden { display: none !important; }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, rgba(56, 199, 147, 0.15), transparent 30%), #0e1720;
    }
    .login-card {
      width: min(440px, 100%);
      background: rgba(17, 30, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
       padding: 28px 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
    }
   .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
   .field label {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .field input {
      padding: 12px 14px;
      background: #101d28;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      outline: none;
    } 
    .field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(56, 199, 147, 0.2);
    }
    .login-btn, .search-btn, .location-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 14px;
      background: linear-gradient(135deg, var(--green), #1bbf9b);
      color: #062d22;
      font-weight: 700;
      cursor: pointer;
    }
    .location-btn {
      width: auto;
      padding: 8px 12px;
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .login-btn:hover, .search-btn:hover, .location-btn:hover {
      filter: brightness(1.04);
    }
    .message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--warning);
      font-size: 0.9rem;
    }
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(11, 22, 28, 0.94);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand span { color: var(--green); }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .nav-btn.active {
      background: var(--green);
      color: #062d22;
      border-color: var(--green);
      font-weight: 600;
    }
    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 199, 147, 0.12);
      border: 1px solid rgba(56, 199, 147, 0.3);
      color: var(--green);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.84rem;
    }
    .logout-btn {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 18px 20px 0;
    }
    .toolbar-card, .route-card, .bus-card {
      background: rgba(22, 35, 44, 0.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
     .toolbar-card label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 8px;
    }
    .toolbar-card select, .toolbar-card input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0d1a22;
      color: var(--text);
    }
    .main-grid {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 18px;
      padding: 18px 20px 20px;
    }
    .route-list {
      display: grid;
      gap: 12px;
    }
    .route-card {
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .route-card.active {
      border-color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(56, 199, 147, 0.3);
    }
    .route-card:hover { transform: translateY(-1px); }
    .route-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .route-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .route-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }
    .route-card p {
      margin: 4px 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #map {
      height: 520px;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .route-details {
      display: grid;
      gap: 16px;
    }
    .route-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 8px;
    }
    .route-header h2 {
      margin: 0;
      font-size: 1.35rem;
    }
    .stop-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .stop-tag {
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(138, 211, 255, 0.08);
      border: 1px solid rgba(138, 211, 255, 0.25);
      color: var(--text);
      font-size: 0.8rem;
    }
